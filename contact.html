<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Pawnet</title>
    <link rel="stylesheet" href="contact.css" />
    <link rel="stylesheet" href="navbar.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo-container">
        <img
          src="https://i.postimg.cc/CKP98hCh/img-8444.png"
          alt="Logo"
          class="logo-img"
        />
        <div class="logo-text">Pawfect</div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="aboutme.html">About us</a>
        <a href="Report.html">Report pet</a>
        <a href="Search.html">Search pet</a>
        <a href="animalshelters.html">Animal shelters</a>
        <a href="contact.html">Contact</a>
        <a href="Ourteam.html">Our team</a>
      </div>
    </nav>

    <main class="contact-container">
      <h1>Contact Us</h1>
      <p>
        If you have any questions or want to report a lost pet, feel free to get
        in touch with us!
      </p>

      <form class="contact-form">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="Full name" required />

        <label for="email">Your email</label>
        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          required
        />

        <label for="message">Your message</label>
        <textarea
          id="message"
          rows="5"
          placeholder="Write your message here..."
          required
        ></textarea>

        <button type="submit">Send message</button>
      </form>
    </main>

    <script src="contactsheet.js"></script>
    <script src="contact.js"></script>
  </body>
</html>
